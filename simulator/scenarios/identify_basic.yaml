# Identify: basic tampering scenarios (first cut, 5 scenarios).
#
# Each scenario describes what PHYSICALLY happens at the gate. The simulator assumes the sensors report faithfully
# what is there (the plate reader reads whatever plate is on the truck, even a fake one; the FASTag reader reads
# whatever tag is on the windscreen; the radar measures the real length). The question is whether the GB's
# checks catch the tampering, not whether a sensor is accurate.
#
# vehicle:      {registered: <plate>}  = a real truck from the GB registry (its true length is the enrolled length)
#               {rogue: <name>}        = a truck that is NOT in the registry (defined under rogue_vehicles)
# plate_shown:  own | none | <plate>   = what plate is physically mounted
# fastag:       own | none | {from: <registered plate>}  = which tag is on the windscreen
# expected.caught_by:      checks that MUST appear in the result's caught_by
# expected.not_caught_by:  checks that must NOT appear (proves which check did the work)

suite: identify_basic
description: Five basic tampering cases at the gate, each exercising one Identify check.
gate: G1
direction: IN

rogue_vehicles:
  rogue_local_tipper:   { own_plate: OD09ZX7781, length_m: 8.1 }   # outside truck with its own plate
  rogue_big_tipper:     { own_plate: OD14QQ0042, length_m: 9.7 }   # bigger (4-axle) truck
  rogue_same_size:      { own_plate: OD02KK7310, length_m: 8.3 }   # same size as OD09AB1234 (8.32 m)
  rogue_plain:          { own_plate: OD11MM5521, length_m: 8.4 }

scenarios:
  - id: S1
    name: Honest trip (control)
    kind: honest
    why: A genuine registered truck must pass with no alarm; false alarms make officers ignore the system.
    physical:
      vehicle: { registered: OD09AC5678 }
      plate_shown: own
      fastag: own
    expected:
      result: AUTHORISED
      caught_by: []

  - id: S2
    name: Unregistered truck
    kind: tamper
    real_case: B3 unregistered vehicles carrying material (tampering_cases.md)
    why: Only trucks the GB physically inspected may work; anything else is flagged, whatever its paperwork says.
    physical:
      vehicle: { rogue: rogue_local_tipper }
      plate_shown: own
      fastag: none
    expected:
      result: UNREGISTERED
      caught_by: [registry]

  - id: S3
    name: Fake plate, tag removed
    kind: tamper
    real_case: A1 cloned plate on a different truck
    why: A copied plate looks perfect to a camera; the radar still measures the real truck, which is 1.4 m longer.
    physical:
      vehicle: { rogue: rogue_big_tipper }
      plate_shown: OD09AB1234
      fastag: none
    expected:
      result: MISMATCH
      caught_by: [length]

  - id: S4
    name: Fake plate + FASTag stolen from another truck
    kind: tamper
    real_case: A2 cloned plate + swapped tag on a same-size truck
    why: Same size as the real truck, so length can't help; only the plate-to-FASTag cross-check exposes it.
    physical:
      vehicle: { rogue: rogue_same_size }
      plate_shown: OD09AB1234
      fastag: { from: OD09AE4521 }
    expected:
      result: MISMATCH
      caught_by: [plate_fastag]
      not_caught_by: [length]

  - id: S5
    name: Plate and FASTag removed
    kind: tamper
    real_case: A3 no plate / obscured identity
    why: If nothing identifies the truck, it is not allowed (default deny), never waved through.
    physical:
      vehicle: { rogue: rogue_plain }
      plate_shown: none
      fastag: none
    expected:
      result: UNIDENTIFIED
      caught_by: [default_deny]
