# Edge resilience: what happens when the site's edge computers or WAN fail (run by auth_run.py).
suite: edge_resilience
title: Edge resilience
description: WAN loss, edge failover, disaster-recovery mode, signed snapshots, emergency movements and reconciliation.

scenarios:
  - id: TC10
    name: WAN disconnection with local operation continuing
    kind: honest
    category: edge
    why: The local edge controller must continue authenticating RFID and issuing trip passes when WAN is offline.
    type: wan_disconnect
    expected:
      wan_status: WAN_OFFLINE_LOCAL_OPERATIONAL
      local_auth_ok: true

  - id: TC11
    name: Primary edge failure and standby takeover
    kind: honest
    category: edge
    why: Upon primary edge failure, the standby controller must take over authorization authority without split brain.
    type: primary_failover
    expected:
      active_authority: STANDBY
      standby_status: ACTIVE

  - id: TC12
    name: Primary and standby failure
    kind: tamper
    category: edge
    why: Complete infrastructure outage triggers emergency disaster recovery mode.
    type: complete_failure
    expected:
      disaster_recovery_mode: true

  - id: TC13
    name: Snapshot-based recovery
    kind: honest
    category: edge
    why: Authorization state is recovered from an encrypted, HMAC-SHA256 digitally signed snapshot.
    type: snapshot_recovery
    expected:
      signature_valid: true
      restored: true

  - id: TC14
    name: Stale snapshot warning
    kind: honest
    category: edge
    why: Snapshots older than 24 hours warn officers that restored state is potentially stale.
    type: stale_snapshot
    expected:
      is_stale: true

  - id: TC15
    name: Emergency authorization
    kind: honest
    category: edge
    why: In disaster recovery mode, officers can manually authorize vehicles with mandatory justification.
    type: emergency_auth
    expected:
      emergency_authorized: true

  - id: TC16
    name: Recovery reconciliation
    kind: honest
    category: edge
    why: Upon infrastructure restoration, automated reconciliation compares emergency logs and reports discrepancies.
    type: reconciliation
    expected:
      reconciled: true
