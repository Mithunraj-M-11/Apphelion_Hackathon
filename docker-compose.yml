name: aphelion

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aphelion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aphelion_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aphelion}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aphelion} -d ${POSTGRES_DB:-aphelion}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aphelion:aphelion_dev@db:5432/aphelion}
      WATCHFILES_FORCE_POLLING: "true"   # auto-reload works on Docker for Windows/macOS
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app                 # live reload while developing
      - ./backend/migrations:/app/migrations   # new migrations appear on the host
      - ./backend/tests:/app/tests
      - uploads:/app/data/uploads              # optional truck photos (persistent)
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules        # keep the container's node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
